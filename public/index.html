<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Man</title>
  <link rel="icon" href="data:," />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;600&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">Man</span>
        <span class="brand-sub">an AI, at your service</span>
      </div>
      <button id="new-chat" class="ghost-btn" title="Start a new conversation">New chat</button>
    </header>

    <main id="thread" class="thread" aria-live="polite">
      <div class="empty-state" id="empty-state">
        <h1>What's on your mind?</h1>
        <p>Ask anything — I'll do my best to give you a real answer, not a hedge.</p>
      </div>
    </main>

    <form id="composer" class="composer">
      <textarea
        id="input"
        rows="1"
        placeholder="Message Man…"
        autofocus
      ></textarea>
      <button type="submit" id="send-btn" aria-label="Send message">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M4 12L20 4L14 20L11 13L4 12Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>
        </svg>
      </button>
    </form>
    <p class="disclaimer">Man can make mistakes. Check important information.</p>
  </div>

  <script src="/app.js"></script>
</body>
</html>
